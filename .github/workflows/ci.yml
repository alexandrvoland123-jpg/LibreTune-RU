name: CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Сборка для Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Установка Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Сборка Tauri (Windows)
        run: cargo tauri build
        working-directory: ./crates/libretune-app
      - name: Загрузить Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: crates/libretune-app/src-tauri/target/release/bundle/

  build-android:
    name: Сборка для Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Установка Android NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "ndk;26.3.11579264"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Установка Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Инициализация Android
        run: cargo tauri android init
        working-directory: ./crates/libretune-app
      - name: Сборка Tauri (Android)
        run: cargo tauri android build
        working-directory: ./crates/libretune-app
      - name: Загрузить Android
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: crates/libretune-app/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
